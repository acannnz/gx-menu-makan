<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menu GX</title>
  <meta name="description" content="Menu makan harian kantor: pagi, siang, sore">
  <meta name="theme-color" content="#FFFBF6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    /* Warna sama dengan widget: widget_colors.xml di android/app/src/main/res/values dan values-night */
    :root {
      --bg: #FFFBF6;
      --col: #F4EDE4;
      --chip: #FFFFFF;
      --text: #221C16;
      --muted: #6B5F53;
      --line: #E8DED2;
      --accent: #C4461A;
      --accent-text: #B03C10;
      --accent-ink: #FFFFFF;
      --accent-soft: #FCE6DA;
      --pagi: #8C5900;
      --pagi-soft: #FCEFD3;
      --siang: #B03C10;
      --siang-soft: #FDE4D7;
      --sore: #5B4BC4;
      --sore-soft: #ECE8FD;
      --radius: 20px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1814;
        --col: #27211C;
        --chip: #342C25;
        --text: #F3ECE4;
        --muted: #A99C8E;
        --line: #352D26;
        --accent: #FF7A45;
        --accent-text: #FF7A45;
        --accent-ink: #1A0E08;
        --accent-soft: #3B2519;
        --pagi: #F2B544;
        --pagi-soft: #382C14;
        --siang: #FF7A45;
        --siang-soft: #3D2418;
        --sore: #A79BF5;
        --sore-soft: #29244A;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .wrap { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

    /* ---------- Header + strip tanggal (sticky) ---------- */
    .sticky {
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
      padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    }
    .top { display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px; }
    .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px; border-radius: 13px; flex: 0 0 auto;
      background: var(--accent); color: #FFFFFF;
      display: grid; place-items: center;
    }
    .logo svg { width: 24px; height: 24px; }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; line-height: 1.2; }
    .brand p { margin: 1px 0 0; font-size: 13px; color: var(--muted); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; border: 0;
      display: grid; place-items: center;
      background: var(--col);
    }
    .icon-btn:active { transform: scale(.95); }
    .icon-btn svg { width: 20px; height: 20px; }

    .strip {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 2px 16px 14px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .strip::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; width: 48px; height: 64px;
      border-radius: 16px; border: 1.5px solid transparent;
      background: var(--col);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      scroll-snap-align: center;
      position: relative;
    }
    .chip .dow { font-size: 12px; color: var(--muted); }
    .chip .num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip--past { opacity: .6; }
    .chip--empty { opacity: .35; }
    .chip--today { border-color: var(--accent); }
    .chip--today .num { color: var(--accent-text); }
    .chip--today::after {
      content: ""; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
    }
    .chip.is-selected { background: var(--accent); border-color: var(--accent); opacity: 1; }
    .chip.is-selected .dow, .chip.is-selected .num { color: var(--accent-ink); }
    .chip.is-selected::after { background: var(--accent-ink); }
    .strip-sep {
      flex: 0 0 auto; align-self: center;
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); padding: 0 2px;
    }

    /* ---------- Judul hari ---------- */
    main { flex: 1; padding: 8px 0 8px; touch-action: pan-y; }
    .day-head { display: flex; align-items: flex-end; gap: 12px; padding: 0 16px 14px; }
    .day-head > div { flex: 1; min-width: 0; }
    .rel {
      display: inline-block; margin: 0 0 6px;
      font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
      color: var(--accent-text); background: var(--accent-soft);
      border-radius: 999px; padding: 4px 10px;
    }
    .day-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
    .pill {
      border: 0; background: var(--col);
      border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 650;
      min-height: 40px; white-space: nowrap;
    }
    .pill--accent { background: var(--accent-soft); color: var(--accent-text); }

    /* ---------- Kartu makan (dua tampilan: kartu / kolom) ---------- */
    .meals { display: grid; gap: 12px; padding: 0 16px; }
    .meal {
      --c: var(--pagi); --c-soft: var(--pagi-soft);
      background: var(--col); border-radius: var(--radius);
      border: 1.5px solid transparent;
      padding: 14px 16px 16px;
      min-width: 0;
    }
    .meal--siang { --c: var(--siang); --c-soft: var(--siang-soft); }
    .meal--sore { --c: var(--sore); --c-soft: var(--sore-soft); }
    .meal.is-now { background: var(--c-soft); border-color: var(--c); }

    .meal-head { display: flex; align-items: center; gap: 10px; }
    .meal-ico {
      width: 36px; height: 36px; border-radius: 12px; flex: 0 0 auto;
      display: grid; place-items: center;
      background: var(--c-soft); color: var(--c);
    }
    .meal.is-now .meal-ico { background: var(--chip); }
    .meal-ico svg { width: 20px; height: 20px; }
    .meal-head h3 { margin: 0; font-size: 18px; color: var(--c); }
    .now {
      margin-left: auto;
      font-size: 12px; font-weight: 700; color: var(--accent-ink);
      background: var(--c); border-radius: 999px; padding: 3px 10px;
    }
    .rice {
      display: inline-block; margin: 12px 0 10px;
      font-size: 13px; color: var(--muted);
      background: var(--chip); border-radius: 8px; padding: 3px 9px;
    }
    .rice--special { color: var(--c); font-weight: 700; }
    .dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
    .dishes li { position: relative; padding-left: 16px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
    .dishes li::before {
      content: ""; position: absolute; left: 2px; top: .58em;
      width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55;
    }
    .dishes li.main { font-size: 17px; font-weight: 650; color: var(--text); }
    .dishes li.main::before { background: var(--c); opacity: 1; }
    .meal-head + .dishes { margin-top: 12px; }

    /* Tampilan kolom: Pagi | Siang | Sore berdampingan, seperti widget */
    .meals--cols { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; padding: 0 12px; }
    .meals--cols .meal { padding: 11px 10px 12px; border-radius: 18px; }
    .meals--cols .meal-head { gap: 6px; }
    .meals--cols .meal-ico { width: auto; height: auto; background: none; border-radius: 0; }
    .meals--cols .meal.is-now .meal-ico { background: none; }
    .meals--cols .meal-ico svg { width: 17px; height: 17px; }
    .meals--cols .meal-head h3 { font-size: 15px; }
    .meals--cols .now { width: 8px; height: 8px; padding: 0; font-size: 0; }
    .meals--cols .rice { margin: 9px 0 8px; font-size: 11.5px; padding: 2px 7px; border-radius: 7px; }
    .meals--cols .dishes { gap: 4px; }
    .meals--cols .dishes li { font-size: 13px; padding-left: 11px; line-height: 1.3; }
    .meals--cols .dishes li::before { left: 0; top: .5em; width: 5px; height: 5px; }
    .meals--cols .dishes li.main { font-size: 14px; }
    .meals--cols .meal-head + .dishes { margin-top: 9px; }

    .empty {
      text-align: center; padding: 32px 20px;
      background: var(--col); border-radius: var(--radius);
    }
    .empty .meal-ico { margin: 0 auto 12px; width: 48px; height: 48px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-text); }
    .empty h3 { margin: 0 0 6px; font-size: 18px; }
    .empty p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
    .btn {
      border: 0; border-radius: 14px; padding: 12px 18px; min-height: 44px;
      background: var(--accent); color: var(--accent-ink); font-weight: 700;
    }
    .btn--soft { background: var(--chip); color: var(--text); }

    /* Ajakan pasang widget (aplikasi Android) */
    .promo {
      margin: 16px 16px 0; padding: 14px;
      display: flex; align-items: center; gap: 12px;
      background: var(--accent-soft); border-radius: var(--radius);
    }
    .promo[hidden] { display: none; }
    .promo .meal-ico { background: var(--chip); color: var(--accent-text); width: 42px; height: 42px; }
    .promo div { flex: 1; min-width: 0; }
    .promo strong { display: block; font-size: 15px; }
    .promo span { font-size: 13px; color: var(--muted); }
    .promo .btn { padding: 10px 14px; min-height: 40px; }

    .enter-next { animation: in-next .22s ease-out; }
    .enter-prev { animation: in-prev .22s ease-out; }
    @keyframes in-next { from { opacity: 0; transform: translateX(18px); } }
    @keyframes in-prev { from { opacity: 0; transform: translateX(-18px); } }
    @media (prefers-reduced-motion: reduce) { .enter-next, .enter-prev { animation: none; } }

    footer {
      padding: 22px 16px calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
      color: var(--muted); font-size: 13px; text-align: center;
    }
    footer p { margin: 0 0 4px; }
    .ghost-btn {
      margin-top: 12px; border: 1.5px solid var(--line); background: none;
      border-radius: 14px; padding: 10px 16px; min-height: 44px;
      color: var(--accent-text); font-weight: 650; font-size: 14px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .ghost-btn svg { width: 18px; height: 18px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); width: max-content;
      background: var(--text); color: var(--bg);
      padding: 12px 16px; border-radius: 14px; font-size: 14px;
      transition: opacity .2s, transform .2s; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sticky">
      <header class="top">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5"/><path d="M3 4v5a1.5 1.5 0 0 0 3 0V4M4.5 9v11M21 15V4a3 3 0 0 0-2.5 3v6.5H21M21 15v5"/></svg>
          </span>
          <div>
            <h1>Menu Makan</h1>
            <p id="monthLabel">Memuat…</p>
          </div>
        </div>
        <button id="viewBtn" class="icon-btn" type="button" aria-label="Tampilan kartu" title="Ganti tampilan"></button>
        <button id="shareBtn" class="icon-btn" type="button" aria-label="Bagikan menu tanggal ini" title="Bagikan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
        <button id="importBtn" class="icon-btn" type="button" aria-label="Import file Excel menu" title="Import Excel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        </button>
      </header>
      <nav class="strip" id="strip" aria-label="Pilih tanggal"></nav>
    </div>

    <main id="main">
      <div class="day-head">
        <div>
          <p class="rel" id="relLabel"></p>
          <h2 id="dayTitle"></h2>
        </div>
        <button id="todayBtn" class="pill" type="button" hidden>Hari ini</button>
        <button id="tomorrowBtn" class="pill pill--accent" type="button" hidden>Besok →</button>
      </div>
      <div id="meals" class="meals" aria-live="polite"></div>

      <section class="promo" id="widgetCard" hidden>
        <span class="meal-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 3v18M15 3v18"/></svg>
        </span>
        <div>
          <strong>Widget layar utama</strong>
          <span>Lihat menu hari ini tanpa membuka aplikasi</span>
        </div>
        <button id="widgetBtn" class="btn" type="button">Pasang</button>
      </section>
    </main>

    <footer>
      <p id="sourceLabel"></p>
      <p>Geser kiri/kanan untuk ganti hari</p>
      <button id="importLink" class="ghost-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>
        Import Excel menu bulan baru
      </button>
    </footer>
  </div>

  <input type="file" id="fileInput" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
